<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Chat</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 上方：信息栏 -->
      <header class="header">
        <!-- 第一行：登录状态 -->
        <div class="header-row">
          <span id="authStatus" class="status status--disconnected">Not Logged In</span>
          <span class="url-text">https://localhost:8890</span>
          <div class="header-actions">
            <span id="userEmail" class="user-email">Test@sparkx.com</span>
            <input id="apiBaseUrl" class="input input--url" type="text" spellcheck="false" placeholder="API Base URL" />
            <input id="email" class="input input--id" type="text" spellcheck="false" placeholder="Email" />
            <input id="password" class="input input--id" type="password" spellcheck="false" placeholder="Password" />
            <button id="loginBtn" class="btn btn--small">Login</button>
            <button id="logoutBtn" class="btn btn--small btn--secondary" disabled>Logout</button>
          </div>
        </div>
        <!-- 第二行：连接状态 -->
        <div class="header-row header-row--border">
          <span id="status" class="status status--disconnected">Disconnected</span>
          <span class="url-text" id="wsUrlText">ws://127.0.0.1:8001/ws</span>
          <div class="header-stats">
            <span class="stat-chip" id="statUserId">-</span>
            <span class="stat-chip" id="statSessionId">-</span>
            <span class="stat-chip" id="statProjectId">-</span>
          </div>
          <div class="header-actions">
            <input id="wsUrl" class="input input--url" type="text" spellcheck="false" placeholder="WebSocket URL" />
            <input id="userId" class="input input--id" type="text" spellcheck="false" placeholder="User ID" />
            <input id="sessionId" class="input input--id" type="text" spellcheck="false" placeholder="Session ID" />
            <input id="projectId" class="input input--id" type="text" spellcheck="false" placeholder="项目ID" />
            <input id="projectIdOut" class="input input--id" type="text" spellcheck="false" placeholder="项目ID输出" readonly />
            <button id="connectBtn" class="btn btn--small">Connect</button>
            <button id="disconnectBtn" class="btn btn--small btn--secondary" disabled>Disconnect</button>
          </div>
        </div>
      </header>

      <!-- 下方：左右布局 -->
      <main class="main">
        <!-- 左边：版本预览区域 -->
        <section class="left-area">
          <!-- 版本选择 -->
          <div class="version-selector">
            <div class="panel-header">
              <div class="panel-title">
                <span class="title-zh">游戏版本选择</span>
                <span class="title-en">Game version selection</span>
              </div>
              <button id="refreshBuildVersionsBtn" class="btn btn--small btn--with-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                  <path d="M16 21h5v-5"/>
                </svg>
                刷新 Refresh
              </button>
            </div>
            <div id="buildVersionsList" class="build-versions-list">
              <div class="build-version-empty">暂无构建版本 There is no build version yet</div>
            </div>
          </div>

          <!-- 游戏预览区域 -->
          <div class="game-preview">
            <div class="panel-header">
              <div class="panel-title">
                <span class="title-zh">游戏预览</span>
                <span class="title-en">Game preview</span>
              </div>
            </div>
            <div id="gamePreviewContent" class="game-preview-content">
              <!-- 背景装饰 -->
              <div class="preview-bg-decoration">
                <div class="bg-blob bg-blob--1"></div>
                <div class="bg-blob bg-blob--2"></div>
              </div>
              <!-- 预览内容 -->
              <div class="preview-content">
                <div class="game-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <line x1="6" y1="12" x2="10" y2="12"/>
                    <line x1="8" y1="10" x2="8" y2="14"/>
                    <line x1="15" y1="13" x2="15.01" y2="13"/>
                    <line x1="18" y1="11" x2="18.01" y2="11"/>
                    <rect x="2" y="6" width="20" height="12" rx="2"/>
                  </svg>
                </div>
                <h3 class="preview-title">游戏预览</h3>
                <p class="preview-subtitle">请选择一个版本</p>
              </div>
            </div>
          </div>
        </section>

        <!-- 右边：聊天区域 -->
        <aside class="chat-area">
          <div class="panel-header">
            <span class="panel-title-chat">聊天 Chat</span>
          </div>
          <div id="messages" class="messages"></div>
          <footer class="footer">
            <form id="composer" class="composer">
              <input
                id="text"
                class="input input--text"
                type="text"
                placeholder="输入消息，回车发送"
                autocomplete="off"
              />
              <select id="modeSelect" class="select select--mode">
                <option value="agent">Agent</option>
                <option value="skill">Skill</option>
              </select>
              <select id="runModeSelect" class="select select--mode">
                <option value="live">Live</option>
                <option value="async">Async</option>
              </select>
              <button id="sendBtn" class="btn" type="submit" disabled>Send</button>
            </form>
          </footer>
        </aside>
      </main>
    </div>
    <script type="module" src="./main.js?v=4"></script>
  </body>
</html>
